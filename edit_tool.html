<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit - {{ tool[4] }}</title>
    <style>
        body{font-family:Inter;background:#f4f6f9;padding:20px}
       .card{background:white;padding:25px;border-radius:12px;max-width:600px;margin:auto;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        label{display:block;font-size:12px;font-weight:700;margin-top:15px;color:#334155}
        input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px}
       .btn{background:#4f46e5;color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin-top:20px}
       .cancel{display:block;text-align:center;background:#f1f5f9;color:#475569;padding:12px;border-radius:8px;text-decoration:none;font-weight:600;margin-top:10px}
    </style>
</head>
<body>
<div class="card">
    <h3>Edit Tool - {{ tool[4] }}</h3>
    <p style="font-size:13px;color:#64748b;margin:8px 0 15px;background:#f8fafc;padding:8px;border-radius:6px;">ID: {{ tool[4] }} | Qty: {{ tool[10] }}</p>

    <form method="POST" enctype="multipart/form-data">
	<label>Tool ID / Code *</label>
        <input type="text" name="tool_code" value="{{ tool[4] }}" readonly style="background-color: #f1f5f9; cursor: not-allowed;">
        <label>Tool Name *</label>
        <input type="text" name="tool_name" value="{{ tool[1] }}" required>

        <label>Type *</label>
        <select name="item_type" required>
            <option value="unique" {% if tool[9]=='unique' %}selected{% endif %}>Non Quantity - Single Tool</option>
            <option value="bulk" {% if tool[9]=='bulk' %}selected{% endif %}>Quantity Item - Bulk (CNSHUJ100)</option>
        </select>

        <label>Total Quantity</label>
        <input type="number" name="total_qty" value="{{ tool[10] }}" min="1">

        <label>Brand Name</label>
        <input type="text" name="brand_name" value="{{ tool[2] }}">

        <label>Group Name *</label>
        <input type="text" name="tool_group" value="{{ tool[3] }}" required>

        <label>Current Image</label><br>
        <img src="{{ tool[5] }}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd;margin:8px 0;"><br>

        <label>Change Image (Optional)</label>
        <input type="file" name="tool_image" accept="image/*">

        <button type="submit" class="btn">💾 Update Tool</button>
        <a href="/tools" class="cancel">Cancel & Go Back</a>
    </form>
</div>
</body>
</html>
